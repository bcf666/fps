<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <!-- 火焰渐变 -->
    <linearGradient id="fireGradLarge" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff4500"/>
      <stop offset="40%" style="stop-color:#ff6b00"/>
      <stop offset="100%" style="stop-color:#00f0ff"/>
    </linearGradient>
    
    <!-- 文字渐变 -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b00"/>
      <stop offset="100%" style="stop-color:#00f0ff"/>
    </linearGradient>
    
    <!-- 发光效果 -->
    <filter id="glowLarge">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 强发光 -->
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 火焰背景装饰 -->
  <path d="M 380 60 Q 340 20, 300 60 Q 340 100, 380 60" fill="url(#fireGradLarge)" opacity="0.4" filter="url(#glowLarge)"/>
  <path d="M 360 60 Q 300 10, 240 60 Q 300 110, 360 60" fill="url(#fireGradLarge)" opacity="0.3"/>
  
  <!-- 速度线 -->
  <line x1="310" y1="45" x2="350" y2="35" stroke="#00f0ff" stroke-width="3" opacity="0.7"/>
  <line x1="310" y1="60" x2="370" y2="60" stroke="#00f0ff" stroke-width="4" opacity="0.8"/>
  <line x1="310" y1="75" x2="350" y2="85" stroke="#00f0ff" stroke-width="3" opacity="0.7"/>
  
  <!-- 主文字 RAPID -->
  <text x="0" y="75" font-family="Orbitron, Arial Black, sans-serif" font-size="48" font-weight="900" 
        fill="url(#textGrad)" filter="url(#strongGlow)">RAPID</text>
  
  <!-- 主文字 FIRE -->
  <text x="180" y="75" font-family="Orbitron, Arial Black, sans-serif" font-size="48" font-weight="900" 
        fill="#ff6b00" filter="url(#strongGlow)">FIRE</text>
  
  <!-- 子弹图标 -->
  <g transform="translate(20, 85)">
    <!-- 小子弹装饰 -->
    <ellipse cx="0" cy="0" rx="12" ry="5" fill="#333"/>
    <polygon points="12,0 -5,-4 -5,4" fill="#ff6b00"/>
    <line x1="18" y1="-5" x2="35" y2="-10" stroke="#00f0ff" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- 底部副标题 -->
  <text x="200" y="105" font-family="Rajdhani, Arial, sans-serif" font-size="14" font-weight="600" 
        fill="#666" text-anchor="middle" letter-spacing="8">FAST-PACED FPS</text>
</svg>